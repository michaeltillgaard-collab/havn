backend:
  name: github
  repo: michaeltillgaard-collab/havn
  branch: main
  base_url: https://havn.michaeltillgaard.workers.dev
  auth_endpoint: /auth
  # Tilføj denne linje:
  site_domain: michaeltillgaard-collab.github.io
  # Client ID fortæller GitHub, hvilken app der spørger
  client_id: Ov23lii3TCh7jQNE8cYq 

media_folder: "images" # Hvor billeder gemmes i dit repo (opret mappen hvis den ikke findes)
public_folder: "/images"

collections:
  - name: "indstillinger"
    label: "Infoskærm Indstillinger"
    files:
      - name: "meddelelser"
        label: "Aktuelle Meddelelser"
        file: "meddelelser.json" # Denne fil oprettes automatisk
        fields:
          - label: "Meddelelser"
            name: "besked"
            widget: "list"
            field: 
              label: "Tekst"
              name: "tekst"
              widget: "string"
